[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokeprice"
version = "0.1.0"
description = "Track Pokemon card prices and predict short-term price movements"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "requests>=2.31",
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "py7zr>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "httpx>=0.25",
]

[project.scripts]
pokeprice = "pokeprice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pokeprice.web" = ["static/*", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
