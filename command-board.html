<!--

  Single-file app. No frameworks, no build step. Open in any modern browser.
  All data lives in localStorage under "psCommandBoard_v1" — use Data & Settings
  to download a JSON backup.

<style>
:root{
  --bg:#f5f6fa; --panel:#ffffff; --ink:#161825; --mut:#6b7085; --line:#e4e7f2;

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);

button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);

header{position:sticky;top:0;z-index:40;background:var(--panel);border-bottom:1px solid var(--line)}
.hwrap{max-width:1280px;margin:0 auto;padding:14px 18px 0}
.hrow{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
h1{margin:0;font-size:15px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
h1 b{color:var(--acc)}
.catbox{position:relative;flex:1;min-width:240px;max-width:430px;margin-left:auto}
.catbox input{border-radius:999px;padding:8px 15px}
.catresults{position:absolute;top:calc(100% + 6px);right:0;width:min(420px,92vw);max-height:350px;

.catrow .cn{font-weight:600}
.catrow .cn i{color:var(--mut);font-weight:400;font-size:11px}
.st-open{color:var(--green);font-weight:800;letter-spacing:.06em;font-size:11px}
.st-taken{color:var(--red);font-weight:600;font-size:12px;text-align:right}

.tab{background:none;border:none;border-bottom:2px solid transparent;padding:9px 2px;cursor:pointer;

.tab.on{color:var(--ink);border-bottom-color:var(--acc)}

.tab .badge.b2{background:var(--acc)}
main{max-width:1280px;margin:0 auto;padding:18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;

section.panel{padding:15px 18px;margin-bottom:16px}
h2{margin:0 0 4px;font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}

.sub{color:var(--mut);font-size:12px;margin:0 0 10px}

.crow{border-top:1px solid var(--line)}
.chead{display:flex;gap:10px;align-items:center;padding:9px 4px;cursor:pointer;flex-wrap:wrap}

/* ================= UTILS ================= */
let _uidN = 0;
function uid(){ return 'x' + Date.now().toString(36) + (_uidN++).toString(36) + Math.random().toString(36).slice(2,6); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function norm(s){ return String(s || '').trim().toLowerCase(); }
function money(n){ return '$' + (Math.round(+n) || 0).toLocaleString('en-US'); }
function todayISO(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function parseDate(s){ const p = String(s).split('-').map(Number); return new Date(p[0], (p[1]||1)-1, p[2]||1); }
function daysUntil(s){ if(!s) return null; const t = new Date(); t.setHours(0,0,0,0); return Math.round((parseDate(s) - t) / 864e5); }
function fmtShort(s){ return s ? parseDate(s).toLocaleDateString('en-US',{month:'short',day:'numeric'}) : ''; }
function fmtLeft(ms){
  if (ms <= 0) return 'expired';
  const h = Math.floor(ms/36e5), m = Math.floor(ms % 36e5 / 6e4);
  return h >= 1 ? h + 'h ' + m + 'm' : m + 'm';
}
let toastTimer = null;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2000);
}
function copyText(text, msg){
  const done = () => toast(msg || 'Copied to clipboard');
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch(e){ toast('Copy failed — select and copy manually'); }
    ta.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(done, fallback);
  else fallback();
}

function fixPlacement(p){
  p.id = p.id || uid();
  p.status = p.status === 'hold' ? 'hold' : 'sold';
  p.advertiser = p.advertiser || '';
  p.first = p.first || '';
  p.category = p.category || '';
  p.email = p.email || '';
  p.phone = p.phone || '';
  p.size = p.size || '';
  p.units = +p.units || 1;
  p.price = +p.price || 0;
  p.annual = !!p.annual;
  p.qr = !!p.qr;
  p.source = p.source ? (TAGS[p.source] ? p.source : deriveTag(p.source)) : '';
  p.holdExpiry = p.holdExpiry || '';
  p.touches = Object.assign(blankTouches(), p.touches || {});
  p.renewedNext = !!p.renewedNext;
  p.check = Object.assign(blankCheck(), p.check || {});
  p.notes = p.notes || '';
  return p;
}
function fixLead(l){

  l.notes = l.notes || '';
  l.lastTouch = l.lastTouch || '';
  return l;
}
// Tolerates older saves: fills defaults for settings, leads, tags, checklists, sources.
function migrate(s){
  s = (s && typeof s === 'object') ? s : {};
  s.settings = Object.assign({renewalLeadDays:14, hideIntro:false}, s.settings || {});
  s.settings.renewalLeadDays = Math.min(60, Math.max(1, +s.settings.renewalLeadDays || 14));
  s.cards = Array.isArray(s.cards) ? s.cards : [];
  s.leads = Array.isArray(s.leads) ? s.leads : seedLeads(); // older saves (pre-leads): seed the 171 once
  for (const c of s.cards){
    c.id = c.id || uid();
    c.name = c.name || 'Card';
    c.type = SIZES[c.type] ? c.type : 'standard';
    c.status = c.status === 'building' ? 'building' : 'live';
    c.note = c.note || '';
    c.lockDate = c.lockDate || '';
    c.mailDate = c.mailDate || '';
    c.placements = Array.isArray(c.placements) ? c.placements : [];
    c.placements.forEach(fixPlacement);
    c.history = Array.isArray(c.history) ? c.history : [];
    for (const h of c.history){
      h.runLabel = h.runLabel || 'Past run';
      h.placements = Array.isArray(h.placements) ? h.placements : [];
      h.placements.forEach(p => { fixPlacement(p); p.renewDecision = ['renewed','lost'].includes(p.renewDecision) ? p.renewDecision : ''; });
    }
  }
  s.leads.forEach(fixLead);
  return s;
}
function freshState(){

}

function renewQueue(){
  const q = {holds:[], asks:[], results:[], mids:[], wins:[]};
  const lead = state.settings.renewalLeadDays;
  for (const c of state.cards){
    const dtl = daysUntil(c.lockDate);
    const dsm = c.mailDate ? -daysUntil(c.mailDate) : null;
    for (const p of c.placements){
      if (p.status === 'hold'){ q.holds.push({c, p}); continue; }
      if (!p.annual && !p.renewedNext && !p.touches.renewal && dtl !== null && dtl <= lead) q.asks.push({c, p, dtl});
      if (dsm !== null && dsm >= 2 && dsm <= 21 && !p.touches.results) q.results.push({c, p, dsm});
      if (dsm !== null && dsm >= 22 && dsm <= 60 && !p.touches.midcycle) q.mids.push({c, p, dsm});
    }
    c.history.forEach((h, hi) => h.placements.forEach(p => { if (!p.renewDecision) q.wins.push({c, h, hi, p}); }));
  }
  q.total = q.holds.length + q.asks.length + q.results.length + q.mids.length + q.wins.length;
  return q;
}
function clientList(){
  const out = [];
  for (const c of state.cards)
    for (const p of c.placements)
      if (p.status === 'sold') out.push({c, p});
  return out;
}
function clientsIncomplete(){ return clientList().filter(x => checkDone(x.p) < checkKeys(x.p).length).length; }

function monthOf(dstr){ if(!dstr) return 'next'; return new Date(dstr + 'T12:00:00').toLocaleDateString('en-US',{month:'long'}); }

function chipHold(p){
  const ms = Date.parse(p.holdExpiry || '') - Date.now();
  return isNaN(ms) || ms <= 0
    ? '<span class="chip red">hold expired</span>'
    : '<span class="chip amber">hold ' + fmtLeft(ms) + '</span>';
}
function pRow(c, p){
  const chips = [];
  if (p.status === 'hold') chips.push(chipHold(p));
  else chips.push('<span class="chip green">sold</span>');
  if (p.annual) chips.push('<span class="chip acc">annual</span>');
  if (p.renewedNext) chips.push('<span class="chip green">renewed</span>');
  if (p.status === 'sold'){
    const total = checkKeys(p).length, done = checkDone(p);
    chips.push('<span class="chip ' + (done === total ? 'green' : 'mutc') + '">' + done + '/' + total + '</span>');
  }
  return '<div class="prow" data-a="spot-open" data-card="' + c.id + '" data-id="' + p.id + '">' +
    '<div class="pmain"><b>' + esc(p.advertiser) + '</b> <span class="mut">· ' + esc(p.category) + '</span>' +
    '<div class="mut small">' + esc(p.size) + ' · ' + money(p.price) +
    (p.source ? ' · ' + esc(TAGS[p.source] || p.source) : '') + (p.qr ? ' · QR' : '') + '</div></div>' +
    '<div class="pchips">' + chips.join('') + '</div></div>';
}
function cardPanel(c){
  const cap = capOf(c);
  const sold = c.placements.filter(p => p.status === 'sold');
  const held = c.placements.filter(p => p.status === 'hold');
  const soldU = sold.reduce((a,p) => a + (p.units||1), 0);
  const heldU = held.reduce((a,p) => a + (p.units||1), 0);
  const soldR = sold.reduce((a,p) => a + (+p.price||0), 0);
  const heldR = held.reduce((a,p) => a + (+p.price||0), 0);
  const sPct = Math.min(100, soldU / cap * 100);
  const hPct = Math.min(100 - sPct, heldU / cap * 100);
  const dtl = daysUntil(c.lockDate);
  let lockChip = '';
  if (dtl !== null)
    lockChip = dtl < 0 ? '<span class="chip red">lock passed</span>'
      : '<span class="chip ' + (dtl <= 7 ? 'red' : 'acc') + '">locks in ' + dtl + 'd</span>';
  const typeChip = '<span class="chip ' + (c.type === 'standard' ? 'line' : 'acc') + '">' + TYPE_LABEL[c.type] + '</span>' +
    (c.status === 'building' ? ' <span class="chip amber">building</span>' : '');
  const rows = c.placements.map(p => pRow(c, p)).join('');
  const histNote = c.history.length
    ? '<div class="mut small">' + c.history.length + ' archived run' + (c.history.length > 1 ? 's' : '') +
      ' · ' + c.history.reduce((a,h) => a + h.placements.length, 0) + ' win-back candidate spots</div>' : '';
  return '<div class="panel cardp">' +
    '<div class="cardhead"><div><div class="cname">' + esc(c.name) + ' ' + typeChip + '</div>' +
      '<div class="cnote">' + esc(c.note) + '</div></div>' +
      '<div class="menuwrap"><button class="iconbtn" data-a="card-menu" aria-label="Card menu">⋯</button>' +
      '<div class="menu">' +
        '<button data-a="card-edit" data-card="' + c.id + '">Edit card</button>' +
        '<button data-a="card-next" data-card="' + c.id + '">Start next run (archive)</button>' +
        '<button data-a="card-status" data-card="' + c.id + '">Mark ' + (c.status === 'live' ? 'building' : 'live') + '</button>' +
        '<button class="dan" data-a="card-del" data-card="' + c.id + '" data-confirm>Delete card</button>' +
      '</div></div></div>' +
    '<div class="fill"><div class="s" style="width:' + sPct + '%"></div><div class="h" style="width:' + hPct + '%"></div></div>' +
    '<div class="statrow"><b>' + (soldU + heldU) + '/' + cap + '</b> units · <b>' + money(soldR) + '</b> sold' +
      (heldR ? ' · <span style="color:var(--amber)"><b>' + money(heldR) + '</b> held</span>' : '') + '</div>' +
    '<div class="dates">' +
      '<div><label>Print lock</label><input type="date" data-a="card-lock" data-card="' + c.id + '" value="' + esc(c.lockDate) + '"></div>' +
      '<div><label>Mailed</label><input type="date" data-a="card-mail" data-card="' + c.id + '" value="' + esc(c.mailDate) + '"></div>' +
      '<div style="padding-bottom:5px">' + lockChip + '</div></div>' +
    '<div class="plist">' + (rows || '<div class="empty">No spots yet — the whole card is open.</div>') + '</div>' +
    histNote +
    '<button class="btn ghost" data-a="spot-add" data-card="' + c.id + '">+ Add spot</button>' +
    '</div>';
}

  return '<div class="grid">' + state.cards.map(cardPanel).join('') +

const TIER_RANK = {HIGH:0, MED:1, LOW:2};
function filteredLeads(){
  const q = norm(leadFilters.q);
  return state.leads.filter(l => {
    if (leadFilters.stage && l.stage !== leadFilters.stage) return false;
    if (leadFilters.tag && l.tag !== leadFilters.tag) return false;
    if (q){
      const hay = [l.biz, l.first, l.cat, l.area, l.src, l.notes, l.angle, l.email, l.phone].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort((a,b) => (TIER_RANK[a.tier] - TIER_RANK[b.tier]) || (b.n - a.n) || a.biz.localeCompare(b.biz));
}

/* ================= RENDER: DATA & SETTINGS ================= */
function revenueBySource(){
  const rows = {};
  const bump = (tag, kind, val) => { const k = tag || ''; (rows[k] = rows[k] || {leads:0, spots:0, rev:0})[kind] += val; };
  for (const l of state.leads) bump(l.tag, 'leads', 1);
  for (const c of state.cards){
    for (const p of c.placements) if (p.status === 'sold'){ bump(p.source, 'spots', 1); bump(p.source, 'rev', +p.price || 0); }
    for (const h of c.history) for (const p of h.placements){ bump(p.source, 'spots', 1); bump(p.source, 'rev', +p.price || 0); }
  }
  return rows;
}
function renderData(){
  const s = state.settings;
  const rev = revenueBySource();
  const keys = TAG_ORDER.concat(rev[''] ? [''] : []).filter(k => rev[k] && (rev[k].leads || rev[k].spots || rev[k].rev));
  const revRows = keys.map(k => {
    const r = rev[k];
    return '<tr><td>' + (k ? esc(TAGS[k]) : '<i>(untagged)</i>') + '</td><td class="num">' + r.leads +
      '</td><td class="num">' + r.spots + '</td><td class="num">' + money(r.rev) + '</td></tr>';
  }).join('');
  const tot = keys.reduce((a,k) => ({leads:a.leads + rev[k].leads, spots:a.spots + rev[k].spots, rev:a.rev + rev[k].rev}), {leads:0, spots:0, rev:0});
  const priceRows = SIZES.standard.map(x =>
    '<tr><td>' + esc(x.size) + '</td><td class="num">' + x.units + '</td><td class="num">' + money(x.price) + '</td><td>' + (x.qr ? 'QR required' : '—') + '</td></tr>').join('');
  const eliteRows = SIZES.elite.map(x =>
    '<tr><td>' + esc(x.size) + '</td><td class="num">max ' + x.cap + '</td><td class="num">' + money(x.price) + '</td><td>QR required</td></tr>').join('');
  return '' +
  '<section class="panel"><h2>Backup</h2><p class="sub">Everything lives in this browser’s localStorage (key ' + LS_KEY + '). Back up before clearing the browser or switching machines.</p>' +

function saveSpot(){
  const g = id => document.getElementById(id);
  const card = findCard(modal.pickCard ? g('f_card').value : modal.cardId);
  if (!card) return;
  const adv = g('f_adv').value.trim(), first = g('f_first').value.trim(), cat = g('f_cat').value.trim();
  const warn = g('spotWarn');
  if (!adv || !cat){
    warn.innerHTML = '<div class="warnbox">Business name and category are both required.</div>';
    modal.armed = false; return;
  }
  const size = g('f_size').value;
  const list = sizesFor(card);
  const def = list.find(s => s.size === size);
  const units = def ? def.units : 1;
  const editing = modal.pid ? card.placements.find(p => p.id === modal.pid) : null;
  const others = card.placements.filter(p => p !== editing);
  const issues = [];
  const dup = others.find(p => norm(p.category) === norm(cat));
  if (dup) issues.push('Category “' + esc(cat) + '” is already ' + (dup.status === 'hold' ? 'on hold for ' : 'taken by ') +
    esc(dup.advertiser) + ' on this card. One business per category per card.');
  if (card.type === 'elite' && def && def.cap){
    const n = others.filter(p => p.size === size).length;
    if (n >= def.cap) issues.push('Elite cap reached: max ' + def.cap + ' × ' + esc(size) + ' on this card.');
  }
  const cap = capOf(card);
  const used = others.reduce((a,p) => a + (p.units || 1), 0);
  if (used + units > cap) issues.push('Over capacity: this puts the card at ' + (used + units) + '/' + cap + ' units.');
  if (issues.length && !modal.armed){
    warn.innerHTML = '<div class="warnbox">' + issues.map(i => '<div>⚠ ' + i + '</div>').join('') +
      '<div style="margin-top:5px;font-weight:400">Save again to override.</div></div>';
    modal.armed = true;
    g('spotSaveBtn').textContent = 'Save anyway';
    return;
  }
  const status = g('f_status').value === 'hold' ? 'hold' : 'sold';
  let p = editing;
  if (!p){
    p = {id:uid(), touches:blankTouches(), check:blankCheck(), renewedNext:false, holdExpiry:''};
    card.placements.push(p);
  }
  Object.assign(p, {
    status, advertiser:adv, first, category:cat,
    email:g('f_email').value.trim(), phone:g('f_phone').value.trim(),
    size, units, price:Math.max(0, +g('f_price').value || 0),
    annual:g('f_annual').checked, qr:g('f_qr').checked,
    source:g('f_source').value, notes:g('f_notes').value.trim()
  });
  if (status === 'hold'){
    const hs = g('f_hold') ? g('f_hold').value : '24';
    if (hs !== 'keep' || !p.holdExpiry)
      p.holdExpiry = new Date(Date.now() + (hs === '48' ? 48 : 24) * 36e5).toISOString();
  } else p.holdExpiry = '';
  const converted = !!modal.leadId;
  if (converted) state.leads = state.leads.filter(l => l.id !== modal.leadId);
  save(); closeModal();
  toast(converted ? 'Lead converted — spot saved on ' + card.name : 'Spot saved');
}

function startNextRun(c){
  const keep = [], gone = [];
  for (const p of c.placements){
    if (p.status === 'hold'){ keep.push(p); continue; }
    if (p.annual || p.renewedNext){
      p.renewedNext = false;
      p.touches = blankTouches();
      p.check = blankCheck();
      keep.push(p);
    } else gone.push(Object.assign({}, p, {renewDecision:''}));
  }
  const src = c.mailDate || c.lockDate;
  const label = (src ? parseDate(src) : new Date()).toLocaleDateString('en-US',{month:'short',year:'numeric'}) + ' run';
  if (gone.length) c.history.unshift({runLabel:label, placements:gone});
  c.placements = keep;
  c.lockDate = ''; c.mailDate = '';
  save(); render();
  toast(gone.length
    ? 'Run archived — ' + gone.length + ' spot' + (gone.length > 1 ? 's' : '') + ' moved to win-backs, annual/renewed carried forward'
    : 'New run started — annual/renewed spots carried forward');
}

const EMAIL_RE = /[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}/;
const PHONE_RE = /(\+?1[\s.\-]?)?\(?\d{3}\)?[\s.\-]?\d{3}[\s.\-]?\d{4}/;
function splitLine(line){
  if (line.includes('\t')) return line.split('\t');
  const out = []; let cur = '', inQ = false;
  for (const ch of line){
    if (ch === '"') { inQ = !inQ; cur += ch; }
    else if (ch === ',' && !inQ){ out.push(cur); cur = ''; }
    else cur += ch;
  }
  out.push(cur);
  return out;
}
function runImport(){
  const txt = document.getElementById('imp_text').value;
  const lines = txt.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  let added = 0;
  for (const line of lines){
    const cells = splitLine(line).map(s => s.trim().replace(/^["']+|["']+$/g, '').trim());
    if (!cells.length || !cells[0]) continue;
    const lower = cells.map(x => x.toLowerCase());
    if (/^(business( name)?|name|company|biz|lead|advertiser)$/.test(lower[0]) ||
        lower.includes('email') || lower.includes('category') || lower.includes('phone')) continue;
    let email = '', phone = '';
    const rest = [];
    cells.forEach((cell, i) => {
      let cv = cell;
      if (!email){ const m = cv.match(EMAIL_RE); if (m){ email = m[0]; cv = cv.replace(m[0], '').trim(); } }
      if (!phone){ const m = cv.match(PHONE_RE); if (m){ phone = m[0].trim(); cv = cv.replace(m[0], '').trim(); } }
      cv = cv.replace(/^[\s,;·|\-]+|[\s,;·|\-]+$/g, '');
      if (i === 0) cells[0] = cv || cells[0];
      else if (cv) rest.push(cv);
    });
    const biz = cells[0].trim();
    if (!biz) continue;
    const src = rest[2] || '';
    state.leads.push(fixLead({id:uid(), tier:'MED', n:0, biz, first:'', cat:rest[0] || '', email, phone,
      area:rest[1] || '', src, tag:deriveTag(src), angle:'', stage:'prospected', notes:'', lastTouch:''}));
    added++;
  }
  save(); closeModal();
  toast(added + ' lead' + (added === 1 ? '' : 's') + ' imported');
}

}

  const box = document.getElementById('restoreBox');
  const err = document.getElementById('restoreErr');
  try {
    const obj = JSON.parse(box.value);
    if (!obj || typeof obj !== 'object' || (!Array.isArray(obj.cards) && !Array.isArray(obj.leads)))
      throw new Error('That JSON doesn’t look like a Command Board backup (no cards/leads arrays).');
    state = migrate(obj);
    save(); render();
    toast('Board restored from paste');
  } catch(e){
    err.textContent = 'Restore failed: ' + (e && e.message ? e.message : 'invalid JSON');
  }
}

function openComposeFor(kind, c, p, saveTo){
  const t = kind === 'renewal' ? tRenewal(c, p) : kind === 'results' ? tResults(c, p)
    : kind === 'mid' ? tMid(c, p) : tWinback(c, p);
  const titles = {renewal:'Renewal ask', results:'Results touch', mid:'Mid-cycle touch', winback:'Win-back'};
  openModal({kind:'compose', title:titles[kind] + ' — ' + p.advertiser, subject:t.subject, body:t.body,
    to:p.email || '', saveTo});
}

/* ================= EVENT DELEGATION =================
   One click listener + one change listener dispatch on data-a attributes.
   (Plus input for live search filters, and keydown for Escape.) No inline handlers.
   No alert/confirm/prompt: destructive buttons carry data-confirm and arm to
   "Sure?" for 2.6s before the second click executes. */
function closeMenus(except){
  document.querySelectorAll('.menu.open').forEach(m => { if (!except || !except.contains(m)) m.classList.remove('open'); });
}
function arm(el){
  el.dataset.armed = '1';
  el.dataset.orig = el.textContent;
  el.textContent = 'Sure?';
  el.classList.add('armed');
  setTimeout(() => {
    if (document.contains(el) && el.dataset.armed){
      delete el.dataset.armed;
      el.textContent = el.dataset.orig;
      el.classList.remove('armed');
    }
  }, 2600);
}

document.addEventListener('click', e => {
  const mw = e.target.closest('.menuwrap');
  closeMenus(mw);
  if (e.target === overlayEl()){ closeModal(); return; }
  const el = e.target.closest('[data-a]');
  if (!el) return;
  const a = el.dataset.a;
  if (el.dataset.confirm !== undefined && !el.dataset.armed){ arm(el); return; }
  const cardOf = () => findCard(el.dataset.card);
  const pOf = () => findP(el.dataset.card, el.dataset.id);

  switch(a){
    case 'tab': tab = el.dataset.tab; render(); break;
    case 'intro-hide': state.settings.hideIntro = true; save(); render(); break;

    /* cards */
    case 'card-menu': { const m = el.parentElement.querySelector('.menu'); if (m) m.classList.toggle('open'); break; }
    case 'card-add': openModal({kind:'card'}); break;
    case 'card-edit': openModal({kind:'card', cardId:el.dataset.card}); break;
    case 'card-status': { const c = cardOf(); c.status = c.status === 'live' ? 'building' : 'live'; save(); render(); break; }
    case 'card-next': startNextRun(cardOf()); break;
    case 'card-del': state.cards = state.cards.filter(c => c.id !== el.dataset.card); save(); render(); toast('Card deleted'); break;
    case 'card-save': saveCard(); break;
    case 'spot-add': openModal({kind:'spot', cardId:el.dataset.card}); break;
    case 'spot-open': openModal({kind:'spot', cardId:el.dataset.card, pid:el.dataset.id}); break;
    case 'spot-save': saveSpot(); break;
    case 'spot-del': { const c = cardOf(); c.placements = c.placements.filter(p => p.id !== el.dataset.id); save(); closeModal(); toast('Spot deleted'); break; }

    /* renewal engine */
    case 'hold-dm': { const {card, p} = pOf(); copyText(dmHold(card, p), 'Lock-or-release DM copied'); break; }
    case 'hold-sold': { const {p} = pOf(); p.status = 'sold'; p.holdExpiry = ''; save(); render(); toast('Locked — marked sold'); break; }
    case 'hold-release': { const c = cardOf(); c.placements = c.placements.filter(p => p.id !== el.dataset.id); save(); render(); toast('Hold released — category open again'); break; }
    case 'ask-draft': { const {card, p} = pOf(); p.touches.renewal = true; save(); render(); openComposeFor('renewal', card, p, v => { p.email = v; }); break; }
    case 'ask-mark': { const {p} = pOf(); p.renewedNext = true; save(); render(); toast('Marked renewed for next run'); break; }
    case 'res-draft': { const {card, p} = pOf(); p.touches.results = true; save(); render(); openComposeFor('results', card, p, v => { p.email = v; }); break; }
    case 'mid-draft': { const {card, p} = pOf(); p.touches.midcycle = true; save(); render(); openComposeFor('mid', card, p, v => { p.email = v; }); break; }
    case 'wb-draft': { const c = cardOf(); const p = c.history[+el.dataset.run].placements.find(x => x.id === el.dataset.id);
      openComposeFor('winback', c, p, v => { p.email = v; }); break; }
    case 'wb-back': { const c = cardOf(); const p = c.history[+el.dataset.run].placements.find(x => x.id === el.dataset.id);
      const np = Object.assign({}, p, {id:uid(), status:'sold', annual:false, renewedNext:false, holdExpiry:'',
        touches:blankTouches(), check:blankCheck()});
      delete np.renewDecision;
      c.placements.push(np);
      p.renewDecision = 'renewed';
      save(); render(); toast(p.advertiser + ' is back on ' + c.name); break; }
    case 'wb-lost': { const c = cardOf(); const p = c.history[+el.dataset.run].placements.find(x => x.id === el.dataset.id);
      p.renewDecision = 'lost'; save(); render(); toast('Marked lost'); break; }

    /* leads */
    case 'lead-add': openModal({kind:'lead'}); break;
    case 'lead-edit': openModal({kind:'lead', leadId:el.dataset.id}); break;
    case 'lead-save': saveLead(); break;
    case 'lead-del': state.leads = state.leads.filter(l => l.id !== el.dataset.id); save(); render(); toast('Lead deleted'); break;
    case 'lead-cold': { const l = state.leads.find(x => x.id === el.dataset.id);
      if (l.stage === 'prospected') l.stage = 'pitched';
      l.lastTouch = todayISO();
      save(); render();
      const t = tCold(l);
      openModal({kind:'compose', title:'Cold email — ' + l.biz, subject:t.subject, body:t.body, to:l.email || '', saveTo:v => { l.email = v; }});
      break; }
    case 'lead-dm': { const l = state.leads.find(x => x.id === el.dataset.id);
      l.lastTouch = todayISO(); save(); render();
      copyText(dmCold(l), 'Cold DM copied'); break; }
    case 'lead-convert': { const l = state.leads.find(x => x.id === el.dataset.id);
      const firstLive = state.cards.find(c => c.status === 'live') || state.cards[0];
      if (!firstLive){ toast('Add a card first'); break; }
      openModal({kind:'spot', pickCard:true, cardId:firstLive.id, leadId:l.id,
        prefill:{advertiser:l.biz, first:l.first, category:l.cat, email:l.email, phone:l.phone,
          source:l.tag, notes:[l.angle, l.notes].filter(Boolean).join(' · ')}});
      break; }
    case 'import-open': openModal({kind:'import'}); break;
    case 'import-run': runImport(); break;

    /* clients */
    case 'client-toggle': { const id = el.dataset.id; expanded.has(id) ? expanded.delete(id) : expanded.add(id); render(); break; }

    /* compose */
    case 'copy-subject': copyText(document.getElementById('c_subj').value, 'Subject copied'); break;
    case 'copy-body': copyText(document.getElementById('c_body').value, 'Body copied'); break;
    case 'compose-mailto': { const to = document.getElementById('c_to').value.trim();
      location.href = 'mailto:' + encodeURIComponent(to) +
        '?subject=' + encodeURIComponent(document.getElementById('c_subj').value) +
        '&body=' + encodeURIComponent(document.getElementById('c_body').value);
      break; }
    case 'compose-gmail': { const to = document.getElementById('c_to').value.trim();
      const subject = document.getElementById('c_subj').value, body = document.getElementById('c_body').value;
      Promise.resolve()
        .then(() => window.cowork.callMcpTool(GMAIL_DRAFT, {to:[to], subject:subject, body:body}))
        .then(() => toast('Gmail draft created'))
        .catch(() => toast('Gmail bridge unavailable — use Copy'));
      break; }
    case 'modal-close': closeModal(); break;

    /* data & settings */
    case 'backup-dl': downloadBackup(); break;
    case 'backup-copy': copyText(JSON.stringify(state, null, 2), 'Backup JSON copied'); break;
    case 'restore-run': runRestore(); break;
    case 'reset-all': try { localStorage.removeItem(LS_KEY); } catch(err){}
      state = freshState(); save(); render(); toast('Board reset to the 10 seed cards'); break;
  }
});

document.addEventListener('change', e => {
  if (modal && e.target.closest('.modal')) resetSpotWarn();
  const el = e.target.closest('[data-a]');
  if (!el) return;
  switch(el.dataset.a){
    case 'card-lock': { const c = findCard(el.dataset.card); c.lockDate = el.value; save(); render(); break; }
    case 'card-mail': { const c = findCard(el.dataset.card); c.mailDate = el.value; save(); render(); break; }
    case 'lead-stage': { const l = state.leads.find(x => x.id === el.dataset.id);
      l.stage = el.value; l.lastTouch = todayISO(); save(); render(); break; }
    case 'check-item': { const {p} = findP(el.dataset.card, el.dataset.id);
      p.check[el.dataset.k] = el.checked; save(); render(); break; }
    case 'f-size': syncSizeFields(); break;
    case 'f-card': rebuildSizeOptions(); break;
    case 'f-status': { const hr = document.getElementById('holdRow'); if (hr) hr.hidden = el.value !== 'hold'; break; }
    case 'set-leaddays': { state.settings.renewalLeadDays = Math.min(60, Math.max(1, +el.value || 14)); save(); render(); break; }
    case 'set-intro': state.settings.hideIntro = !el.checked; save(); render(); break;
    case 'leads-stagef': leadFilters.stage = el.value; render(); break;
    case 'leads-tagf': leadFilters.tag = el.value; render(); break;
    case 'compose-to': if (modal && modal.kind === 'compose' && modal.saveTo){ modal.saveTo(el.value.trim()); save(); } break;
  }
});

document.addEventListener('input', e => {
  const el = e.target.closest('[data-a]');
  if (!el) return;
  if (el.dataset.a === 'cat-search'){ catQuery = el.value; renderCatResults(); }
  else if (el.dataset.a === 'leads-q'){
    leadFilters.q = el.value;
    const rows = document.getElementById('leadRows');
    if (rows) rows.innerHTML = leadRowsHtml();
    const cnt = document.getElementById('leadCount');
    if (cnt) cnt.textContent = leadCountText();
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    if (modal) closeModal();
    closeMenus();
    const cr = document.getElementById('catResults');
    if (cr){ cr.hidden = true; }
  }
});

/* 45s re-render keeps hold countdowns and days-to-lock chips fresh.
   Skipped while a modal is open, a menu is open, or an input has focus. */
setInterval(() => {
  if (modal) return;
  if (document.querySelector('.menu.open')) return;
  const ae = document.activeElement;
  if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;
  render();
  renderCatResults();
}, 45000);

render();
</script>
